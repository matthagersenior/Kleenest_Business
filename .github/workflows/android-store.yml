name: Build Business Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-store.yml'
      - 'app/**'
      - 'src/**'
      - 'components/**'
      - 'services/**'
      - 'app.config.ts'
      - 'eas.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  store-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 15ac343b-81bf-459b-8c25-1b2fc8b293de
      EXPO_PUBLIC_OTA_CHANNEL: business-production
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require Expo automation token
        run: test -n "$EXPO_TOKEN"
      - name: Install and verify Business
        run: |
          npm install --no-audit --no-fund
          npm run audit
          npm run typecheck
          npx eas-cli@latest whoami
          npx expo config --type public > /tmp/kleenest-business-config.txt
          grep -q "$EAS_PROJECT_ID" /tmp/kleenest-business-config.txt
          grep -q 'com.kleenest.business' /tmp/kleenest-business-config.txt
      - name: Build signed Play bundle locally
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform android --profile production --non-interactive --local --output "$GITHUB_WORKSPACE/Kleenest-Business-production.aab"
          test -s Kleenest-Business-production.aab
          unzip -t Kleenest-Business-production.aab >/dev/null
          sha256sum Kleenest-Business-production.aab | tee Kleenest-Business-production.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Business-Play-AAB-${{ github.run_id }}
          path: |
            Kleenest-Business-production.aab
            Kleenest-Business-production.aab.sha256
          if-no-files-found: error
          retention-days: 30
