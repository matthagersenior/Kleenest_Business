name: Publish Business OTA Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'app.config.ts'
      - 'eas.json'
      - '.github/workflows/ota-update.yml'

permissions:
  contents: read

concurrency:
  group: business-production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 15ac343b-81bf-459b-8c25-1b2fc8b293de
      EXPO_PUBLIC_OTA_CHANNEL: business-production
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Business OTA credential
        run: test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured in Kleenest_Business" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami --non-interactive
      - name: Verify dedicated Business Expo identity
        run: |
          npx expo config --type public --json > expo-config.json
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('expo-config.json','utf8'));
          const project='15ac343b-81bf-459b-8c25-1b2fc8b293de';
          const channel='business-production';
          const failures=[];
          if(c.slug!=='kleenest-business')failures.push(`slug=${c.slug}`);
          if(c.extra?.eas?.projectId!==project)failures.push(`projectId=${c.extra?.eas?.projectId}`);
          if(c.updates?.url!==`https://u.expo.dev/${project}`)failures.push(`updates.url=${c.updates?.url}`);
          if(c.updates?.requestHeaders?.['expo-channel-name']!==channel)failures.push(`channel=${c.updates?.requestHeaders?.['expo-channel-name']}`);
          if(c.runtimeVersion!=='kleenest-business-0.1.0')failures.push(`runtimeVersion=${c.runtimeVersion}`);
          if(failures.length)throw new Error(`Business Expo identity mismatch: ${failures.join(', ')}`);
          console.log('Business Expo identity and OTA channel verified.');
          NODE
      - name: Verify Business release source
        run: |
          npm run audit
          npm run typecheck
      - name: Publish Business OTA update
        run: npx eas-cli@latest update --channel business-production --message "Business ${GITHUB_SHA}" --non-interactive
      - name: Verify Business OTA is discoverable
        run: |
          npx eas-cli@latest update:list --channel business-production --limit 1 --json --non-interactive > ota-latest.json
          grep -q "$GITHUB_SHA" ota-latest.json
