name: Publish Business OTA Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'app.config.ts'
      - '.github/workflows/ota-update.yml'

permissions:
  contents: read

concurrency:
  group: business-production-ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Business OTA credential
        run: test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is not configured in Kleenest_Business" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami --non-interactive
      - name: Verify current Business control-center source
        run: |
          grep -q 'Business CRUD' app/index.tsx
          grep -q 'QR Studio' app/index.tsx
          grep -q 'Create location QR' app/qr-studio.tsx
          grep -q 'ENTERPRISE OPERATING SYSTEM' app/enterprise.tsx
          grep -q 'Advanced Intelligence' app/index.tsx
      - name: Publish Business OTA update
        run: npx eas-cli@latest update --channel business-production --message "Business ${GITHUB_SHA}" --non-interactive
