name: Android Standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-standalone-apk
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://ssgesjzdvdsqacdtasje.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL' }}
      KLEENEST_STANDALONE_ANDROID: '1'
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and deduplicate dependencies
        run: |
          npm install --no-audit --no-fund
          npm dedupe
      - run: npm run audit
      - run: npm run typecheck
      - name: Expo health and production bundle preflight
        run: |
          npx expo-doctor
          rm -rf .preflight
          test -s assets/app-icon.png
          npx expo config --type public --json > /tmp/business-expo-config.json
          node -e "const c=require('/tmp/business-expo-config.json');if(c.android?.package!=='com.kleenest.business')process.exit(1);if(c.name!=='Kleenest Business')process.exit(1);if(c.icon!=='./assets/app-icon.png'||c.android?.icon!=='./assets/app-icon.png')process.exit(1)"
          npx expo export --platform android --output-dir .preflight --clear
          test -n "$(find .preflight -type f -print -quit)"
      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --clean
      - name: Apply supplied Business launcher artwork
        run: |
          set -euo pipefail
          test -s assets/app-icon.png
          ICON_SHA="$(sha256sum assets/app-icon.png | awk '{print $1}')"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rm -f "$dir"/ic_launcher.png "$dir"/ic_launcher.webp "$dir"/ic_launcher_round.png "$dir"/ic_launcher_round.webp "$dir"/ic_launcher_foreground.png "$dir"/ic_launcher_foreground.webp
            cp assets/app-icon.png "$dir/ic_launcher.png"
            cp assets/app-icon.png "$dir/ic_launcher_round.png"
            test "$(sha256sum "$dir/ic_launcher.png" | awk '{print $1}')" = "$ICON_SHA"
            test "$(sha256sum "$dir/ic_launcher_round.png" | awk '{print $1}')" = "$ICON_SHA"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Ensure Android NDK 27 is valid
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=27.1.12297006
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ -s "$NDK_DIR/source.properties" ]; then
            echo "NDK $NDK_VERSION already valid."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)..."
            rm -rf "$NDK_DIR" "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/temp" || true
            set +o pipefail
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" || true
            set -o pipefail
            if [ -s "$NDK_DIR/source.properties" ]; then
              grep -E 'Pkg.Revision|Pkg.Desc' "$NDK_DIR/source.properties" || true
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to install a valid NDK $NDK_VERSION after 3 attempts." >&2
          exit 1
      - name: Pre-package native and manifest diagnostics
        working-directory: android
        run: |
          ./gradlew :app:processReleaseMainManifest :app:compileDebugKotlin --no-daemon
          find app/build/intermediates -path '*release*AndroidManifest.xml' -print -exec grep -n '<uses-permission' {} \; > /tmp/business-manifest-permissions.txt || true
          cat /tmp/business-manifest-permissions.txt
      - name: Verify standalone release dependency graph
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/business-release-deps.txt
          grep -Eqi 'react-native-reanimated' /tmp/business-release-deps.txt
          grep -Eqi 'react-native-worklets' /tmp/business-release-deps.txt
          if grep -Eqi 'expo-dev-client|expo-dev-launcher|expo-dev-menu' /tmp/business-release-deps.txt; then
            echo 'Expo development runtime leaked into Business release dependencies.' >&2
            exit 1
          fi
      - name: Build internal release candidate
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release candidate and ARM64 payload
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/business.bundle
          test -s /tmp/business.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/business.bundle
          ! grep -a -q 'Development Build' /tmp/business.bundle
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libreactnative.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libhermesvm.so'
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -Eq 'res/(mipmap|drawable).*(ic_launcher|app_icon)'
      - name: Enable KVM for x86 Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 x86_64 startup diagnostic gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh android/app/build/outputs/apk/release/app-release.apk com.kleenest.business Business-x86_64
      - name: Upload x86 startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Business-x86-Startup-Diagnostics
          path: android-startup-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage internal candidate
        run: cp android/app/build/outputs/apk/release/app-release.apk Kleenest-Business-Candidate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Business-Internal-Candidate
          path: Kleenest-Business-Candidate.apk
          if-no-files-found: error
          retention-days: 1

  arm64-runtime:
    needs: candidate
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kleenest-Business-Internal-Candidate
          path: candidate
      - name: Android 16 ARM64 startup diagnostic gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh candidate/Kleenest-Business-Candidate.apk com.kleenest.business Business-ARM64
      - name: Upload ARM64 startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Business-ARM64-Startup-Diagnostics
          path: android-startup-logs
          if-no-files-found: ignore
          retention-days: 7

  promote:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kleenest-Business-Internal-Candidate
          path: candidate
      - run: cp candidate/Kleenest-Business-Candidate.apk Kleenest-Business-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Business-Standalone-APK
          path: Kleenest-Business-Standalone.apk
          if-no-files-found: error
          retention-days: 30